unit.create-apocalypse.name=天启
unit.create-apocalypse.description=End 的终极飞行形态，以隐身接近，再倾泻整具身躯的火力
unit.create-apocalypse.details=[gray]遍布机体的炮台、持续激光与导弹巢只是前奏，主炮的巨型切割激光才是处决手段，四条自主触手会在近处撕扯目标。血量尚足且未交战时它会整体隐去，受击或敌人靠近才现形。免疫所有状态效果。[]
