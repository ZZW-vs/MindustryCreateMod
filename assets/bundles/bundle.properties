unit.create-zena.details=[gray]中央重型磁轨炮承担主要穿透伤害，两侧磁轨炮补充火力，双联导弹发射器覆盖范围。[]
unit.create-sundown.name=日落
unit.create-sundown.description=以导弹巢齐射与定向护盾支撑的步行火力点
unit.create-sundown.details=[gray]导弹巢一次齐射大量追踪导弹，重型磁轨炮贯穿成排敌人，每一步落地都会震伤周围。定向护盾挡在正面，被击破后缓慢回充。[]
unit.create-rex.name=雷克斯
unit.create-rex.description=悬浮重装步行单位，以重型磁轨与箭弹枪压制正面
unit.create-rex.details=[gray]重型磁轨炮的弹丸穿透力极强，但对建筑效果有限；箭弹枪一枪可穿透两名敌人，双联导弹巢持续倾泻追踪导弹。定向护盾负责拦住正面火力。[]
unit.create-excelsus.name=崇高
unit.create-excelsus.description=全身覆盾的重装步行单位，用持续激光烧穿目标
unit.create-excelsus.details=[gray]小型持续激光压制近敌，大型激光锁定并烧穿主目标，双联导弹巢齐射追踪导弹。免疫燃烧，定向护盾覆盖全身。[]
unit.create-whirlwind.name=旋风
unit.create-whirlwind.description=以长剑激光持续灼烧目标的空中单位
unit.create-whirlwind.details=[gray]中央长剑激光紧咬锁定目标不断灼烧，两翼导弹负责压制其他方向的敌人。[]
unit.create-jetstream.name=急流
unit.create-jetstream.description=转向越急、切割越狠的高速空中单位
unit.create-jetstream.details=[gray]横扫长剑在急转时被甩长，伤害随之提升——机动本身就是它的弹药；副炮同时发射导弹填补空档。[]
unit.create-vortex.name=漩涡
unit.create-vortex.description=横扫长剑的强化形态，用急转积累破坏力
unit.create-vortex.details=[gray]横扫伤害随角位移累积，急转时激光大幅伸长，蓄能一击能直接撕开目标。[]
unit.create-stray.name=游离
unit.create-stray.description=环绕符文环与独眼的能量环单位
unit.create-stray.details=[gray]旋转的符文环与中央之眼环绕本体，射出多枚追踪目标的加速能量弹。[]
unit.create-tendence.name=趋势
unit.create-tendence.description=蓄力后打出重型追踪弹的能量环单位
unit.create-tendence.details=[gray]能量环先蓄力，随后释放一枚重型追踪弹，飞行途中拖出带火花的闪电链。[]
unit.create-liminality.name=阈限
unit.create-liminality.description=释放螺旋飘带与穿透激光的能量环单位
unit.create-liminality.details=[gray]蓄力后打出一道穿透激光，外围环绕旋转的螺旋飘带与侧向虚影，沿途的一切都会被灼烧。[]

