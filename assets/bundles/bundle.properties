unit.create-ryzer.description=磁轨炮与蛇形导弹并用的步行单位
unit.create-ryzer.details=[gray]磁轨炮提供远程穿透火力，五连发导弹以蛇形轨迹绕开障碍追踪目标，落点炸开一片。[]
unit.create-zena.name=泽娜
