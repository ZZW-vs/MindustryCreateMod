unit.create-thalassophobia.description=End 的深海巨兽，用引力场把猎物拖进自己的光束
unit.create-thalassophobia.details=[gray]虚空碎裂炮蓄力后放出黑色尖刺，导弹巢同时覆盖全场，主炮两侧的引力场会把敌人拖进光束。身后的鞭毛长尾随移动摆动，免疫所有状态效果。[]

