block.create-crucible-pump.name=坩埚泵
block.create-crucible-pump.description=熔融网络的定向输送泵。把背面网络中的某一种指定原料泵送到正面网络，由扭矩驱动；用于在互不相连的两张坩埚网络之间单独输送某一种熔融原料。
block.create-casting-mold.name=铸造模具
block.create-casting-mold.description=从坩埚网络吸取熔融物，浇注冷却后重新铸成固体物品；温度过高时无法凝固。
