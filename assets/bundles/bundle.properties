block.create-cache-pad.name=缓存飞行台
block.create-cache-pad.description=生产缓存飞行单位。移动时释放闪电护盾。
block.create-advance-constructor.name=高级构造器
block.create-advance-constructor.description=通过连接高级构造器模块提升等级，解锁并加速建造高级单位。每个模块减少同等级或更高等级单位的建造时间。需要持续供电和材料。
block.create-advance-constructor-module.name=高级构造器模块
block.create-advance-constructor-module.description=链式连接到高级构造器或前一个模块，提升构造器等级以解锁更高级的单位。需要持续供电和低温液体冷却。

# 状态效果
status.create-tpcooldown.name=传送冷却
status.create-tpcooldown.description=单位刚刚传送过，暂时无法再次传送。
status.create-plated.name=装甲强化
status.create-plated.description=强化器施加的永久装甲镀层：伤害提高50%，最大生命值翻倍，装填速度提高20%，移动速度降低25%。
status.create-blue-burn.name=蓝焰灼烧
status.create-blue-burn.description=每秒受到约8.4点持续伤害。与潮湿、冷冻状态互相抵消。
status.create-weaken.name=虚弱
status.create-weaken.description=伤害降低25%，最大生命值降低25%，移动速度减半。
status.create-disabled.name=瘫痪
status.create-disabled.description=完全无法移动、开火或装填。
status.create-sagittarius-fatigue.name=射手疲劳
status.create-sagittarius-fatigue.description=发射超级武器后的疲劳状态：移动速度降低90%，最大生命值降低40%。
status.create-reload-fatigue.name=装填疲劳
status.create-reload-fatigue.description=连射后的疲劳状态：装填速度降低25%。

# 能力
ability.lightning-burst=闪电爆发

# 单位
unit.create-buffer.name=缓冲
unit.create-buffer.description=以闪电霰弹枪突入敌阵的机甲，落地瞬间炸开一圈电弧
unit.create-buffer.details=[gray]手持闪电霰弹枪贴脸输出，落地时会向四周释放一圈闪电爆发，把围上来的敌人掀开；这招需要长时间蓄能，得算准起落时机。脚部推进器还能让它短暂加速冲刺。[]
unit.create-omega.name=欧米伽
unit.create-omega.description=以导弹齐射压制中场、开火时整体展开装甲的机甲
unit.create-omega.details=[gray]四联装导弹提供稳定的范围火力，一旦开火便展开装甲板，防御显著提升但行动变得迟缓，是能顶在阵线最前面的攻坚单位。[]
unit.create-cache.name=缓存
unit.create-cache.description=速度本身就是防御的掠空单位，移动时带出一圈电弧
unit.create-cache.details=[gray]飞行途中不断释放环绕闪电，靠近的敌人会被链状电弧灼伤；四联发导弹让它掠过目标后仍能留下爆炸伤痕。[]
unit.create-arcnelidia.name=电弧虫
unit.create-arcnelidia.description=以电弧激光开路、身后节体持续投弹的虫形单位
unit.create-arcnelidia.details=[gray]头部电弧激光顶在最前，身后的分节躯体一路投下爆炸弹。它只会朝目标直线冲锋，冲过之后才折返，行进中轻轻摆动身体，受损时会缓慢自愈。[]

unit.create-toxobyte.name=毒疫虫
unit.create-toxobyte.description=绕目标游走、不断长出新生体节的瘟疫虫群
unit.create-toxobyte.details=[gray]头部吸附激光抽取敌人生命并回补自身，分节躯体抛洒瘟疫炮弹。它绕着目标盘旋，边打边长出新的节数；被击杀的节体会让整条虫分裂，两条相遇时又会重新接合。[]

unit.create-catenapede.name=吸血虫
unit.create-catenapede.description=缠住目标吸血、能断开又重接的虫形单位
unit.create-catenapede.details=[gray]头部吸血激光一边吸取生命一边把敌人拖向自己，分节躯体发射瘟疫导弹封锁退路。它绕目标盘旋，断开的躯体可以重新接合，一条虫也能分裂成两条。[]

unit.create-devourer.name=噬界虫
unit.create-devourer.description=由数十节躯体组成的巨型虫形单位，每一节都是一处火力点
unit.create-devourer.details=[gray]头部主激光是整条虫的锋刃，沿途节体同时倾泻导弹与副激光。躯体不会再生也不会分裂——它不靠恢复，而是用庞大的身躯和全状态免疫硬生生碾过战场。[]

# Correct devourer key (actual registered name in code is devourer-of-eldrich-gods)
unit.create-devourer-of-eldrich-gods.name=噬界者
unit.create-devourer-of-eldrich-gods.description=噬界者的正式形态，庞大身躯免疫一切状态效果
unit.create-devourer-of-eldrich-gods.details=[gray]头部主激光劈开正面，沿途节体同时倾泻导弹与副激光。整条虫不会再生、不会分裂，也不会合并；它依靠全状态免疫与厚重躯体，一路碾过而不被拖慢。[]

unit.create-oppression.name=压迫者
unit.create-oppression.description=End 的终极虫形兵器，发动大招时几乎把自己钉在原地
unit.create-oppression.details=[gray]头部主激光蓄能后一击贯穿，导弹与慢速闪电层层施压，虚空门户还会撕开缺口召唤触手。发动大招时它的移动与转向几乎停摆，用迟缓换取毁灭性的输出；环绕目标飞行时，厚重的躯体让常规伤害难以留下痕迹。[]

unit.create-enigma.name=谜团
unit.create-enigma.description=用会拐弯的黑色虚空弹追踪猎杀的小型 End 单位
unit.create-enigma.details=[gray]黑色弹丸持续修正方向贴住目标，造成的伤害按目标生命的比例结算——越是庞大的敌人，越吃不住几发。作为小型单位，它靠高机动周旋而不靠硬扛。[]

unit.create-void-vessel.name=虚空容器
unit.create-void-vessel.description=悬停蓄力的 End 单位，以红色主激光与穿甲碎裂弹拆解防线
unit.create-void-vessel.details=[gray]头部红色激光需要蓄能，发射后贯穿整条战线；两侧碎裂弹先悬停锁定，再加速冲刺，命中会削弱目标护甲。它擅长把厚甲单位一点点变成纸。[]

unit.create-chronos.name=克罗诺斯
unit.create-chronos.description=操纵时间的 End 单位，能把战场的节奏攥在自己手里
unit.create-chronos.details=[gray]触发时间停止后，它会在近乎静止的一瞬连续展开多次行动，让敌人完全来不及反应；常规武器发射的时间停止弹则会让被命中的目标陷入迟滞。定位是打断敌方节奏的控制型单位。[]

unit.create-opticaecus.name=盲视者
unit.create-opticaecus.description=隐去身形、从任意角度打出红色激光的 End 单位
unit.create-opticaecus.details=[gray]头部激光不受朝向限制，任何方向都能开火；两侧导弹以蛇形轨迹追踪目标，命中后炸开一片。它靠隐身接近，直到交火才现形。[]

unit.create-ravager.name=掠夺者
unit.create-ravager.description=End 的巨型步行兵器，用噩梦激光封锁整条推进路线
unit.create-ravager.details=[gray]噩梦激光在前方炸出持续封锁的爆点，闪电炮弹与追踪导弹填满间隙。庞大的步行结构每一步落地都会震伤周围敌人，全状态免疫让它几乎不会被打断。[]

unit.create-exowalker.name=外径行者
unit.create-exowalker.description=Plague 的重型步行单位，用瘟疫导弹与吸血激光慢慢蚕食对手
unit.create-exowalker.details=[gray]四座瘟疫导弹发射器以蛇形轨迹缠住目标，吸血激光在造成伤害的同时回补自身。步行结构落地会震伤近处的敌人；它不属于 End 系列，没有那套抗性体系。[]

unit.create-toxoswarmer.name=瘟疫蜂群
unit.create-toxoswarmer.description=Plague 的步行火力平台，八连发导弹留下一地火海
unit.create-toxoswarmer.details=[gray]八连发追踪导弹的落点会持续燃烧，逼退试图靠近的敌人；每一步落地也会震伤周围。[]

unit.create-desolation.name=荒芜者
unit.create-desolation.description=End 的终极步兵，蓄力主炮能一击抹平正面战场
unit.create-desolation.details=[gray]蓄力主炮把一整片区域直接抹去，点防激光拦截来袭弹丸，副炮、闪电炮与触手激光补齐近中远三层火力。每走一步都会落地震伤，全状态免疫让它能一路推到底。[]

# ========== PU_V8 高级单位 ==========
unit.create-citadel.name=君主
unit.create-citadel.description=以磁轨炮远程贯穿、火焰喷射清场的重型装甲单位
unit.create-citadel.details=[gray]磁轨炮的弹道会穿过成列敌人，双火焰喷射器负责把贴脸的对手逼开。免疫燃烧，让它能长时间站在自己点燃的火场里。[]
unit.create-empire.name=帝国
unit.create-empire.description=三重火力叠压的攻城单位，能把阵地烧成焦土
unit.create-empire.details=[gray]火焰喷射、导弹与炮弹分别覆盖近、中、远三个层次，落点持续引燃。免疫燃烧与熔融，让它能在自己制造的炼狱里稳步推进。[]
unit.create-cygnus.name=天鹅座
unit.create-cygnus.description=兼顾治疗与电磁打击的支援型步行单位
unit.create-cygnus.details=[gray]治疗激光修补友军，EMP 弹在敌阵中炸开连锁闪电。它能一边救场，一边把敌方的阵型打散。[]
unit.create-sagittarius.name=人马座
unit.create-sagittarius.description=以蓄力激光远距离狙杀的支援单位，箭弹可治疗友军
unit.create-sagittarius.details=[gray]蓄力激光充能完毕后能远距离一击洞穿目标，箭弹则用来给友军续命。常驻的力场护盾替它挡下大部分来袭伤害，但发射超级武器后会陷入长时间的疲劳。[]
unit.create-araneidae.name=圆网蛛
unit.create-araneidae.description=以吸血激光续航、磁轨炮收线的猎手
unit.create-araneidae.details=[gray]吸血激光在输出的同时补回生命，磁轨炮贯穿一整列目标。靠这两件武器，它能完成自我维持的持续压制。[]
unit.create-theraphosidae.name=捕鸟蛛
unit.create-theraphosidae.description=火力层次最完整的猎手，用持续吸血激光维持战线
unit.create-theraphosidae.details=[gray]导弹压制空中与掩体后的目标，持续吸血激光把伤害转化成生命，磁轨炮补上穿透收尾。它能在交火中越打越稳。[]
unit.create-mantle.name=地幔
unit.create-mantle.description=以持续激光压制、双炮弹补刀的空中单位
unit.create-mantle.details=[gray]持续激光锁定目标不断灼烧，双联炮弹在间隙倾泻连发弹药，远近两种火力几乎不会断档。[]
unit.create-aphelion.name=远日点
unit.create-aphelion.description=以闪电炮弹劈开阵型的空中单位
unit.create-aphelion.details=[gray]持续激光牵制主要目标，闪电炮弹的落点会炸出连锁电弧，专门用来撕开成群的敌人。[]
unit.create-deviation.name=偏差
unit.create-deviation.description=把闪电炮弹钉在战场上持续放电的空中单位
unit.create-deviation.details=[gray]闪电炮弹命中后不会立即消散，而是驻留在原地持续向四周放电。几发弹就能把一整片区域变成禁区。[]
unit.create-anomaly.name=异象
unit.create-anomaly.description=用牵引光束把敌人拖进火力范围的空中单位
unit.create-anomaly.details=[gray]牵引光束吸附并拖慢目标，充能激光的威力随蓄能时间增长，命中时炸开链状闪电。它的身体本身也是武器，撞上去同样会受伤。[]
unit.create-sedec.name=壁垒
unit.create-sedec.description=为友军撑起力场与修复场的支援平台
unit.create-sedec.details=[gray]治疗激光持续修补友军，力场护盾吸收来袭火力，修复场让附近单位缓慢回血。它的价值在于让整条战线活得比自己更久。[]
unit.create-trigintaduo.name=天枢
unit.create-trigintaduo.description=用治疗核弹一次性挽救整片友军的支援单位
unit.create-trigintaduo.details=[gray]常规治疗激光维持战线，治疗核弹在关键位置炸开，把范围内所有友军一并拉回安全线。[]

# ========== PU_V8 mantodea 直升机系列 ==========
unit.create-caelifera.name=蝗虫
unit.create-caelifera.description=轻装武装直升机，机枪与导弹构成基础火力
unit.create-caelifera.details=[gray]机枪扫射压制轻甲目标，导弹补上对重甲与建筑的火力。作为最早成军的旋翼单位，它是整条直升机线的起点。[]
unit.create-schistocerca.name=蝗蝻
unit.create-schistocerca.description=双机枪压制的武装直升机，燃烧弹封锁地面
unit.create-schistocerca.details=[gray]双联机枪输出密集弹幕，燃烧弹在落点引燃，逼退集结的敌军。[]
unit.create-anthophila.name=花蜂
unit.create-anthophila.description=雷电特化的武装直升机
unit.create-anthophila.details=[gray]机枪持续压制，闪电武器在敌群中炸开连锁电弧，专门破解密集阵型。[]
unit.create-vespula.name=胡蜂
unit.create-vespula.description=用穿甲钍弹与持续激光撕开重甲的中型直升机
unit.create-vespula.details=[gray]大口径机枪提供压制，钍弹贯穿成列目标，持续激光负责收尾。它是直升机线里第一档真正具备破甲能力的型号。[]
unit.create-lepidoptera.name=鳞翅
unit.create-lepidoptera.description=兼顾对空与对地的多用途直升机
unit.create-lepidoptera.details=[gray]机枪压制近处目标，导弹追踪高价值单位，榴弹在落点炸开一片。[]
unit.create-mantodea.name=螳螂
unit.create-mantodea.description=专职拦截的直升机，用双联防空炮封锁空域
unit.create-mantodea.details=[gray]两座防空炮对空特化，炮弹落点会产生范围爆炸，专治成群逼近的空中目标。[]

# ========== PU_V8 ultraviolet 系列飞行单位 (EMP特化) ==========
unit.create-discharge.name=磁流
unit.create-discharge.description=最基础的电磁打击单位，以 EMP 弹撕开阵型
unit.create-discharge.details=[gray]EMP 弹命中后炸出连锁闪电，成本低、出手快，适合用数量堆出第一波压制。[]
unit.create-pulse.name=聚磁
unit.create-pulse.description=以充能 EMP 弹换取更强电弧的电磁单位
unit.create-pulse.details=[gray]蓄力后的 EMP 弹电弧更长、伤害更集中；出手节奏比基础型慢，但每一发都更值得等待。[]
unit.create-emission.name=流能
unit.create-emission.description=双联电磁发射单位，用交叉电弧覆盖战场
unit.create-emission.details=[gray]两具 EMP 发射器交替开火，电弧在目标之间跳跃，能同时处理多个方向的敌人。[]
unit.create-waveform.name=镇流
unit.create-waveform.description=以多座小型 EMP 炮台铺开电弧的电磁平台
unit.create-waveform.details=[gray]多座小型 EMP 炮台持续放电，大型发射器负责打出决定性的连锁闪电，远近配合几乎没有死角。[]
unit.create-ultraviolet.name=强磁暴
unit.create-ultraviolet.description=电磁系列的顶点，用十座炮台在空域织出一片雷网
unit.create-ultraviolet.details=[gray]十座 EMP 炮台同时放电，配上一具大型发射器，能在瞬间把整片空域变成电弧的猎场。[]

# ========== PU_V8 治疗机系列 ==========
unit.create-cherub.name=天使
unit.create-cherub.description=最轻便的治疗单位，负责在交火后修补伤口
unit.create-cherub.details=[gray]维修光束可以同时修复单位与建筑，机动性好，适合跟着小队到处救火。[]
unit.create-malakhim.name=大天使
unit.create-malakhim.description=治疗能力更强的中型治疗单位
unit.create-malakhim.details=[gray]大型维修光束的治疗速度与作用范围都更宽，一台就能撑起一支小队的续航。[]
unit.create-seraphim.name=炽天使
unit.create-seraphim.description=环绕友军持续治疗的顶级治疗单位
unit.create-seraphim.details=[gray]多臂维修光束在盘旋中同时照顾多个目标，是整条治疗线里最强的一台。[]

# ===== fin (海军战列舰) =====
unit.create-fin.name=鳍
unit.create-fin.description=以导弹与迫击炮覆盖海面的战列舰
unit.create-fin.details=[gray]追踪导弹锁定移动目标，迫击炮用大范围落点清理集群。速度缓慢，但极难被撼动。[]

# ===== blue (蓝鲸级旗舰) =====
unit.create-blue.name=蔚蓝
unit.create-blue.description=海军旗舰，主炮、侧翼导弹、近防炮与直升机支援齐备
unit.create-blue.details=[gray]前置主炮负责攻坚，侧翼导弹覆盖两舷，迫击炮与近防多管炮兼顾远程与反导；舰上还能持续释放武装直升机支援。[]

# ===== PU132 世界单位 (TerraCore + terra) =====
block.create-terra-core.name=大地核心
block.create-terra-core.description=召唤一个携带建筑物的移动堡垒单位。
unit.create-terra.name=大地
unit.create-terra.description=内部自成一片天地的移动堡垒

